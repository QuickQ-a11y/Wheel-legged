# OpenOCD 配置：烧录和调试共用这一份，改调试器/速度只改这里。
#
# 云台工程（实际应用）。芯片与轮腿底盘同为 STM32H723VG，本文件与
# Wheel-legged/openocd.cfg 内容一致；调试器换代时三份要一起改。
#
# 调试器接口。队里的 Horco CMSIS-DAP 有三把，VID/PID 只有两种，下面两对都列上。
# 换 J-Link   就把下面几行换成： source [find interface/jlink.cfg]
# 换 ST-Link  就换成：           source [find interface/stlink.cfg]

# 这些杂牌厂商 VID 不在 OpenOCD 默认扫描表里，必须显式指定，否则报
# "unable to find a matching CMSIS-DAP device"。cmsis_dap_vid_pid 可以列多对。
#   0xfaed 0x4870  序列号 641261233524，full-speed，带 v2 bulk 接口
#   0xfaed 0x4870  序列号 332107148304，FW Horco v0.2，同上，另一把
#   0xef1a 0x74e5  序列号 4144332032，high-speed，只有 v1 HID 接口
# 换了新探针就用 lsusb 读出硬件 ID；只有 VID/PID 是新的才需要追加到下面这一行，
# 同型号换一把（VID/PID 相同、只是序列号不同）不用改配置，上面记序列号只为排查方便。
# source [find interface/cmsis-dap.cfg]
# cmsis_dap_vid_pid 0xfaed 0x4870 0xef1a 0x74e5

source [find interface/jlink.cfg]

transport select swd

# 目标芯片：STM32H723 属于 H7 系列
source [find target/stm32h7x.cfg]

# SWD 时钟，单位 kHz。先给保守值，稳定后可往上试 2000 / 4000。
adapter speed 1000
